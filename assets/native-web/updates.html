<section class="card" id="native-update" data-can-install="{{can-install}}" data-signed-in="{{signed-in}}" aria-labelledby="native-update-title">
  <h2 id="native-update-title">Signed preview updates</h2>
  <div class="key-actions">
    <button type="button" class="button" id="native-update-check">Check for updates</button>
    <button type="button" class="button button-primary" id="native-update-install" hidden>Install and restart</button>
    <a href="/login?sign-in=1" id="native-update-sign-in" hidden>Sign in to install</a>
  </div>
  <p id="native-update-status" class="notice" role="status" aria-live="polite" hidden></p>
</section>
