[package]
name = "anthropic-token-count-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/app/api/v1/messages/count_tokens/`"


[dependencies]
serde = "1"
ryu-js = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }


[lints.clippy]
all = { level = "warn", priority = -1 }
