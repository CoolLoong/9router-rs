[package]
name = "chat-account-rules-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `open-sse/services/accountFallback.js`, generated by rust-anything"

[lib]
path = "src/entry.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["node-bindings"]
node-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
libm = "0.2"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
napi-build = { version = "2", optional = true }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
