[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"gemini/gemini-2.5-flash","messages":[{"role":"user","content":[{"type":"text","text":"fixture vision Messages to Gemini"},{"type":"image","source":{"type":"base64","media_type":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l7kAAAAASUVORK5CYII="}}]}],"stream":false,"max_tokens":64}'

[request.headers]
