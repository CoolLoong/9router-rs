[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"fixture-anthropic/claude-migration-fixture","system":[{"type":"text","text":"fixture initial"}],"max_tokens":64,"stream":false,"messages":[{"role":"user","content":"Anthropic system prompt fixture"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
