[request]
method = "POST"
path = "/v1/web/fetch"
body = '{"provider":"firecrawl","url":"https://192.0.2.141/fixture?lang=zh"}'

[request.headers]
authorization = "Bearer offline-restricted-key"
content-type = "application/json"

[response]
status = 403

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
