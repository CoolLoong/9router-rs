[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"azure/fixture-azure-deployment","stream":false,"messages":[{"role":"user","content":"fixture azure prompt"}],"response_format":{"type":"json_schema","json_schema":{"name":"reply","schema":{"type":"object"}}}}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
