[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"cloudflare-ai/@cf/runwayml/stable-diffusion-v1-5-inpainting","prompt":"offline workers text","size":"512x768","width":"640","num_steps":4,"negative_prompt":""}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
