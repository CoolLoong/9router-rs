[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"migration-json-combo","stream":false,"messages":[{"role":"user","content":"test combo"}]}'

[request.headers]
authorization = "Bearer offline-restricted-key"
content-type = "application/json"

[response]
status = 403

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
