[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"anthropic/claude-sonnet-4-20250514","stream":false,"max_tokens":20000,"messages":[{"role":"user","content":[{"type":"text","text":"Anthropic native CLI cache"}]}],"system":[{"type":"text","text":"fixture system"}]}'

[request.headers]
content-type = "application/json"
user-agent = "claude-cli/2.0.0 (external)"
x-api-key = "offline-chat-key"
x-app = "cli"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
