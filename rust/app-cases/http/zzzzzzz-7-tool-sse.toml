[request]
method = "POST"
path = "/api/v1/chat/completions"
body = '{"model":"fixture-anthropic/claude-migration-fixture","messages":[{"role":"user","content":"Anthropic tool stream"}],"stream":true,"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{"term":{"type":"string"}}}}}]}'

[request.headers]
accept = "text/event-stream"
content-type = "application/json"
x-api-key = "offline-chat-key"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
