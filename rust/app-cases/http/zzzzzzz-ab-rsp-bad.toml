[request]
method = "POST"
path = "/v1/responses"
body = '{"model":"fixture-responses/fixture-response-model","input":"direct malformed JSON","stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 503

[response.headers]
content-type = "application/json"
retry-after = "30"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
