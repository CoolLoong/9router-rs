[request]
method = "POST"
path = "/v1/images/generations?response_format=binary"
body = '{"model":"cloudflare-ai/@cf/runwayml/stable-diffusion-v1-5-inpainting","prompt":"offline workers binary"}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-disposition = 'inline; filename="image.png"'
content-type = "image/png"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
