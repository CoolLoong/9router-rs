[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gh/claude-sonnet-4.6","messages":[{"role":"system","content":"fixture instructions"},{"role":"user","content":"fixture GitHub Claude stream"}],"stream":true,"max_tokens":64}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
