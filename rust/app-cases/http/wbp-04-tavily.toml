[request]
method = "POST"
path = "/v1/search"
body = '{"provider":"tavily","query":"fixture tavily","max_results":5,"country":"taiwan"}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
