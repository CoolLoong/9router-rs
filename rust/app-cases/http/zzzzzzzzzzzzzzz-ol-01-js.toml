[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"ollama-local/qwen3:8b","stream":false,"temperature":0.125,"max_tokens":64,"messages":[{"role":"user","content":"fixture Ollama JSON"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
