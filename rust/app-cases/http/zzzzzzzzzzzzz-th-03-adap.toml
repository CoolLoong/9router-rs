[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-anthropic/claude-opus-5-5","stream":false,"messages":[{"role":"user","content":"Anthropic adaptive thinking"}],"reasoning_effort":"high"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
