[request]
method = "POST"
path = "/v1/audio/speech"
body = '{"model":"openai/alloy","input":"OpenAI JSON fixture","response_format":"json","speed":1.5}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
