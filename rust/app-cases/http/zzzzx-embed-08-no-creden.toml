[request]
method = "POST"
path = "/v1/embeddings"
body = '{"model":"openai/text-embedding-3-small","input":"inactive provider"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 400

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
