[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":[{"type":"text","text":"fixture vision static OpenAI"},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l7kAAAAASUVORK5CYII=","detail":"low"}}]}],"stream":false,"max_tokens":74}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
