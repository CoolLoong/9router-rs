[request]
method = "POST"
path = "/v1/web/fetch"
body = '{"model":"firecrawl","url":"https://192.0.2.141/fixture?lang=zh"}'

[request.headers]
content-type = "application/json"
x-api-key = "offline-disabled-key"

[response]
status = 401

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
