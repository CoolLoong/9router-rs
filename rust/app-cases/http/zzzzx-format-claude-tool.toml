[request]
method = "POST"
path = "/api/v1/messages"
body = '{"model":"fixture-live/fixture-tools","stream":false,"max_tokens":32,"system":"Fixture instructions","tools":[{"name":"fixture_lookup","description":"Fixture tool","input_schema":{"type":"object","properties":{"term":{"type":"string"}}}}],"messages":[{"role":"user","content":"Find rust"},{"role":"assistant","content":[{"type":"tool_use","id":"call_fixture_previous","name":"fixture_lookup","input":{"term":"prior"}}]},{"role":"user","content":[{"type":"tool_result","tool_use_id":"call_fixture_previous","content":"fixture value"}]}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
