[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gemini/gemini-2.5-flash","messages":[{"role":"user","content":"Gemini tool"}],"stream":true,"tools":[{"type":"function","function":{"name":"9 lookup","parameters":{"type":"object","properties":{"mode":{"const":"local"}},"additionalProperties":false,"required":["mode","removed"]}}}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
