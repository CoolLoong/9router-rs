[request]
method = "GET"
path = "/api/auth/oidc/callback?state=expected&code=fixture"

[request.headers]
cookie = "oidc_state=other; oidc_nonce=fixture-oidc-nonce; oidc_code_verifier=fixture-verifier"
x-forwarded-host = "gateway.example.invalid"
x-forwarded-proto = "https"

[response]
status = 307

[response.headers]
location = "https://gateway.example.invalid/login?error=oidc_invalid_state"
set-cookie = "oidc_state=; Path=/; Expires=Thu, 01 Jan 1970 [..] GMT, oidc_nonce=; Path=/; Expires=Thu, 01 Jan 1970 [..] GMT, oidc_code_verifier=; Path=/; Expires=Thu, 01 Jan 1970 [..] GMT"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
