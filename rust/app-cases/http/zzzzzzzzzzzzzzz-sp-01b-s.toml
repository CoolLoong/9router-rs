[request]
method = "POST"
path = "/v1/audio/speech?response_format=json"
body = '{"model":"inworld/inworld-tts-1.5-max/Alex","input":"Inworld fixture","response_format":"mp3","voice":"ignored"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
