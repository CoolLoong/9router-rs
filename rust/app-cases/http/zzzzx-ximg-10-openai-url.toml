[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"openai/dall-e-3","prompt":"OpenAI fixture URL","n":null,"size":null,"response_format":"url"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
