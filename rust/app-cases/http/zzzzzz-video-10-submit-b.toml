[request]
method = "POST"
path = "/api/v1/videos/generations"
body = '{ "model": "grok-imagine-video", "prompt": "text fixture" }'

[request.headers]
content-type = "application/json"
x-api-key = "offline-chat-key"

[response]
status = 202

[response.headers]
access-control-allow-origin = "*"
content-type = "application/vnd.fixture+json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
x-9router-connection-id = "[..]"
