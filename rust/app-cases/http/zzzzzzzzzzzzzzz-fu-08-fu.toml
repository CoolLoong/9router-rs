[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fusion-empty","stream":true,"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{}}}}],"messages":[{"role":"user","content":"fixture fusion alternative"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 400

[response.headers]
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
