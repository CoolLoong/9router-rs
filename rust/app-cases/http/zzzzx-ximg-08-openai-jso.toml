[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"openai/gpt-image-2.5","prompt":"OpenAI fixture image with usage","n":2,"size":"512x512","quality":"high","style":"vivid","output_format":"png","response_format":"b64_json","watermark":true,"arbitrary":"ignored"}'

[request.headers]
accept = "text/event-stream"
authorization = "Bearer offline-chat-key"
content-type = "application/json"
x-connection-id = "fixture-nonexistent"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
