[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-live/fixture-rate-limit","messages":[{"role":"user","content":"rate limit hello"}],"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 503

[response.headers]
content-type = "application/json"
retry-after = "2"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
