[request]
method = "POST"
path = "/v1/chat/completions?case=unrecognized-region"
body = '{"model":"xmtp/mimo-v2.6-pro","messages":[{"role":"user","content":"fixture Token Plan sgp"}],"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
