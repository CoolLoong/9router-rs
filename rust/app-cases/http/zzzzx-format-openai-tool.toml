[request]
method = "POST"
path = "/v1/v1/chat/completions"
body = '{"model":"fixture-live/fixture-tools","stream":false,"tools":[{"type":"function","function":{"name":"fixture_lookup","description":"Fixture tool","parameters":{"type":"object","properties":{"term":{"type":"string"}}}}}],"messages":[{"role":"user","content":"Find rust"},{"role":"assistant","content":null,"tool_calls":[{"id":"call_fixture_previous","type":"function","function":{"name":"fixture_lookup","arguments":"{\"term\":\"prior\"}"}}]},{"role":"tool","tool_call_id":"call_fixture_previous","content":"fixture value"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
