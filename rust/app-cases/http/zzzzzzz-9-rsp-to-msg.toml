[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"fixture-responses/fixture-response-model","stream":true,"max_tokens":64,"messages":[{"role":"user","content":"stream Responses text pivot"}]}'

[request.headers]
accept = "text/event-stream"
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
