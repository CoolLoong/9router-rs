[request]
method = "POST"
path = "/v1/v1/images/generations?response_format=binary"
body = '{"model":"gemini/gemini-2.5-flash-image","prompt":"Gemini image with data URI","output_format":"webp","n":4,"image":"data:image/jpeg;base64,ZmFrZSB1cGxvYWRlZCBqcGVn","images":["wrong first image"]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-disposition = 'inline; filename="image.webp"'
content-type = "image/webp"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
