[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-responses/gpt-4o-mini","messages":[{"role":"user","content":[{"type":"text","text":"fixture vision Chat to native Responses"},{"type":"image_url","image_url":{"url":"https://example.invalid/fixture.webp?kind=vision"}},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l7kAAAAASUVORK5CYII=","detail":"high"}}]}],"stream":false}'

