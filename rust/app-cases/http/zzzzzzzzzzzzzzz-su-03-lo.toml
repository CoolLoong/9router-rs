[request]
method = "POST"
path = "/api/locale"
body = '{"locale":"zh"}'

[request.headers]
content-type = "application/json"

[response]
status = 400

[response.headers]
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
