[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"fixture-unavailable-local-bypass","system":"fixture command","stream":false,"messages":[{"role":"user","content":"Warmup"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"
user-agent = "claude-cli/2.0.0 (external)"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
