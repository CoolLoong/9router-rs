[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fusion-demo","stream":true,"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{}}}}],"stream_options":{"include_usage":true},"messages":[{"role":"user","content":"fixture tool request"},{"role":"assistant","tool_calls":[{"type":"function","id":"fixture_fusion_call","function":{"name":"fixture_lookup","arguments":"{}"}}]},{"role":"tool","tool_call_id":"fixture_fusion_call","content":"fixture text result"},{"role":"user","content":"fixture fusion panel"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
