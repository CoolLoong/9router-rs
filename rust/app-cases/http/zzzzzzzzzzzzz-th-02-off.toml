[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"anthropic/claude-sonnet-5-5","stream":false,"max_tokens":1000,"messages":[{"role":"user","content":"Anthropic thinking off"}],"output_config":{"effort":"none"}}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
