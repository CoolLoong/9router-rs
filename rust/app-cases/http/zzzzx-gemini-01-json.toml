[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gemini/gemini-2.5-flash","messages":[{"role":"system","content":"fixture instructions"},{"role":"user","content":"Gemini sampling"}],"stream":false,"temperature":0.25,"top_p":0.6,"top_k":33,"max_tokens":90}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
