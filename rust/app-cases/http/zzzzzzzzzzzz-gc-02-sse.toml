[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gc/gemini-2.5-flash","stream":true,"messages":[{"role":"user","content":"Gemini CLI tool validation"}],"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{"q":{"type":"string"}}}}}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"
x-session-id = "1234"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
