body = '{"model":"gemini/gemini-2.5-flash","input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"fixture vision Responses to Gemini"},{"type":"input_image","image_url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l7kAAAAASUVORK5CYII="}]}],"stream":false}'

