[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-live/gpt-5.6-sol","stream":false,"messages":[{"role":"user","content":"Fixture Headroom gateway"},{"role":"assistant","tool_calls":[{"id":"fixture_hr_tool","type":"function","function":{"name":"fixture_read","arguments":"{}"}}]},{"role":"tool","tool_call_id":"fixture_hr_tool","content":"Fixture headroom uncompressed text with useful details"},{"role":"user","content":"Headroom Chat fixture skip"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
