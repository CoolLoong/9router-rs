[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"fixture-anthropic/claude-migration-fixture","stream":false,"max_tokens":32,"messages":[{"role":"user","content":"Anthropic Headroom fixture"},{"role":"assistant","content":[{"type":"tool_use","id":"fixture_hr_tool","name":"fixture_read","input":{}}]},{"role":"user","content":[{"type":"tool_result","tool_use_id":"fixture_hr_tool","content":"Fixture headroom uncompressed text with useful details"}]}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
