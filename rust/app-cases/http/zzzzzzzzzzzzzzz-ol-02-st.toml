[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"ollama-local/qwen3:8b","stream":true,"temperature":0.125,"max_tokens":64,"messages":[{"role":"user","content":"fixture Ollama stream"},{"role":"assistant","content":null,"tool_calls":[{"type":"function","id":"prior-call","function":{"name":"fixture_lookup","arguments":"{\"q\":\"prior\"}"}}]},{"role":"tool","tool_call_id":"prior-call","content":"previous result"}],"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{"q":{"type":"string"}}}}}]}'

[request.headers]
