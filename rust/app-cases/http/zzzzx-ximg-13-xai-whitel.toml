[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"xai/grok-imagine-image","prompt":"xAI whitelist fixture","n":2,"size":"1536x1024","quality":"high","style":"vivid","output_format":"webp","watermark":false,"prompt_extend":true,"response_format":"b64_json"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
