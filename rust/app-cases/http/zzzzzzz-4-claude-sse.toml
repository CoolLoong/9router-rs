[request]
method = "POST"
path = "/v1/messages"
body = '{"model":"fixture-anthropic/claude-migration-fixture","messages":[{"role":"user","content":"Anthropic Messages stream"}],"max_tokens":64,"stream":true}'

[request.headers]
accept = "text/event-stream"
content-type = "application/json"
x-api-key = "offline-chat-key"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
