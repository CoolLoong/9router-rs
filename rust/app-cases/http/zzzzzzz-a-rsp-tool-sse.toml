[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-responses/fixture-response-model","stream":true,"messages":[{"role":"user","content":"stream Responses tool pivot"}],"tools":[{"type":"function","function":{"name":"fixture_lookup","parameters":{"type":"object","properties":{"term":{"type":"string"}}}}}]}'

[request.headers]
accept = "text/event-stream"
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
