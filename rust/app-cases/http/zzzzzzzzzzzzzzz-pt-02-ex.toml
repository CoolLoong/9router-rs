[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"openai/gpt-5.4","messages":[{"role":"user","content":"fixture provider override precedence"}],"stream":false,"max_tokens":74,"reasoning_effort":"low"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
