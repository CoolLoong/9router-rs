[request]
method = "POST"
path = "/v1/embeddings"
body = '{"model":"gemini/gemini-embedding-001","input":"fixture passthrough"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
