path = "/v1/chat/completions"
body = '{"model":"gemini/gemini-2.5-flash","stream":false,"messages":[{"role":"user","content":"Gemini signature"},{"role":"assistant","tool_calls":[{"id":"fixture-gemini-call","type":"function","function":{"name":"_9_lookup","arguments":"{\"mode\":\"local\"}"}}]},{"role":"tool","tool_call_id":"fixture-gemini-call","content":"{\"$ref\":\"sample\"}"}]}'

