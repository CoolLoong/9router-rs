[request]
method = "GET"
path = "/v1/models"

[request.headers]
x-9r-internal-models-fetch = "1"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
