[request]
method = "POST"
path = "/v1/audio/speech"
body = '{"model":"minimax/speech-2.8-hd/fixture-narrator","input":"MiniMax global fixture","response_format":"mp3","voice":"ignored"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "audio/wav"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
