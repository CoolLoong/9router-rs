[request]
method = "POST"
path = "/v1/responses"
body = '{"model":"muse/muse-spark-1.3","input":[{"id":"rs-fixture-input","type":"reasoning","encrypted_content":"fixture-encrypted-response-input","summary":[]},{"role":"user","content":[{"type":"input_text","text":"Muse OAuth Responses"}]}],"reasoning":{"effort":"low"},"include":["reasoning.encrypted_content"],"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
