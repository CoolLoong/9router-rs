[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gh/gpt-5.3-codex","messages":[{"role":"user","content":"fixture GitHub Responses"}],"stream":false,"max_tokens":64,"max_completion_tokens":96}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
