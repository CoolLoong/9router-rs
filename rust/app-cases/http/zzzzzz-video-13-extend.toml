[request]
method = "POST"
path = "/v1/videos/extensions"
body = '{"model":"xai/grok-imagine-video-extend","prompt":"extension fixture","seconds":3}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 202

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
x-9router-connection-id = "[..]"
