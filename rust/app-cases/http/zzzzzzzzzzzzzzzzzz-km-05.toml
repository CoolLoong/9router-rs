[request]
method = "POST"
path = "/v1/responses"
body = '{"model":"kimi/k3","input":"fixture Kimi Responses","stream":false,"store":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
