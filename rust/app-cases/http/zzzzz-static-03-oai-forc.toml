[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"openai/gpt-4o-mini","stream":false,"messages":[{"role":"user","content":"fixture prompt"},{"role":"assistant","content":"previous response","reasoning_content":"private"},{"role":"user","content":"continue fixture"}],"max_tokens":74}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
