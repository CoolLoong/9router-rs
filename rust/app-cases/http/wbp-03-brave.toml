[request]
method = "POST"
path = "/v1/search"
body = '{"provider":"brave-search","search_type":"news","query":"fixture query news","max_results":20,"country":"US","language":"en"}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
