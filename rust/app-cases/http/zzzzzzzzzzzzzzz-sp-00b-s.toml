[request]
method = "POST"
path = "/v1/audio/speech"
body = '{"model":"elevenlabs/eleven_turbo_v2_5/FixtureVoice","input":"ElevenLabs fixture","response_format":"mp3","voice":"ignored"}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "audio/mp3"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
