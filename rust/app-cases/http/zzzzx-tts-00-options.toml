[request]
method = "OPTIONS"
path = "/v1/audio/speech"

[response]
status = 200

[response.headers]
access-control-allow-headers = "*"
access-control-allow-methods = "POST, OPTIONS"
access-control-allow-origin = "*"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
