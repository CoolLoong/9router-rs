[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gemini/gemini-2.5-flash","stream":false,"messages":[{"role":"system","content":"fixture initial"},{"role":"user","content":"Gemini system prompt fixture"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
