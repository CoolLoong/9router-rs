[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gc/gemini-2.5-flash","stream":false,"messages":[{"role":"user","content":"Gemini CLI layout"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"
x-session-id = "1234"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
