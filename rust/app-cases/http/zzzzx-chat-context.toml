[request]
method = "POST"
path = "/api/v1/chat/completions"
body = '{"model":"fixture-live/gpt-5.6-sol[1M]","messages":[{"role":"user","content":"migration hello"}],"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
