[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"fixture-via-http/fixture-proxy-strict","stream":false,"messages":[{"role":"user","content":"check strict proxy transport"}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 503

[response.headers]
content-type = "application/json"
retry-after = "30"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
