[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"cloudflare-ai/@cf/runwayml/stable-diffusion-v1-5-inpainting","prompt":"offline workers mask","image":[7,8,9],"maskImage":"data:image/png;base64,AAH/","strength":0.5}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
