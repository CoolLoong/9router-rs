[request]
method = "GET"
path = "/api/auth/oidc/callback?state=fixture"

[request.headers]
x-forwarded-host = "gateway.example.invalid"
x-forwarded-proto = "https"

[response]
status = 307

[response.headers]
location = "https://gateway.example.invalid/login?error=oidc_missing_code"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
