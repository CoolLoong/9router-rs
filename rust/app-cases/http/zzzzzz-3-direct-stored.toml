[request]
method = "POST"
path = "/v1/responses"
body = '{"model":"fixture-responses/fixture-response-model","input":"direct persisted Responses","previous_response_id":"resp_previous","include":["reasoning.encrypted_content"],"store":false,"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
