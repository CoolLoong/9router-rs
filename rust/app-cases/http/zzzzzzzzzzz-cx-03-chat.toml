[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"cx/gpt-5.6-sol","messages":[{"role":"user","content":"fixture Chat Codex"}],"stream":false,"reasoning_effort":"high","tools":[{"type":"function","function":{"name":"fixture_find","parameters":{"type":"object","properties":{"token":{"type":"string","pattern":"\\p{L}+"},"pattern":{"type":"string","pattern":"^ok$"}}}}}]}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"
x-session-id = "fixture-codex-session"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
