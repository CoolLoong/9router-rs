[request]
method = "POST"
path = "/api/v1/embeddings"
body = '{"model":"fixture-live/fixture-embedding","input":["fixture embedding","\u6570\u7ec4 \ud83d\udef0\ufe0f"],"encoding_format":"base64","dimensions":0}'

[request.headers]
content-type = "application/json"
x-api-key = "offline-chat-key"

