[request]
method = "POST"
path = "/api/v1/responses"
body = '{"model":"fixture-live/fixture-tools","stream":true,"max_output_tokens":32,"instructions":"Fixture instructions","tools":[{"type":"function","name":"fixture_lookup","description":"Fixture tool","parameters":{"type":"object","properties":{"term":{"type":"string"}}}}],"input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"Find rust"}]},{"type":"function_call","call_id":"call_fixture_previous","name":"fixture_lookup","arguments":"{\"term\":\"prior\"}"},{"type":"function_call_output","call_id":"call_fixture_previous","output":"fixture value"}]}'

[request.headers]
accept = "text/event-stream"
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
cache-control = "no-cache"
content-type = "text/event-stream"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
