[request]
method = "POST"
path = "/v1/audio/transcriptions"
body = """
--migration-extra-stt\r
Content-Disposition: form-data; name="model"\r
\r
elevenlabs/scribe_v2\r
--migration-extra-stt\r
Content-Disposition: form-data; name="response_format"\r
\r
srt\r
--migration-extra-stt\r
Content-Disposition: form-data; name="language"\r
\r
 \r
--migration-extra-stt\r
Content-Disposition: form-data; name="num_speakers"\r
\r
4\r
--migration-extra-stt\r
Content-Disposition: form-data; name="file"; filename="migration.wav"\r
Content-Type: audio/wav\r
\r
RIFF migration fake audio bytes\r
--migration-extra-stt--\r
"""

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "multipart/form-data; boundary=migration-extra-stt"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "text/plain; charset=utf-8"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
