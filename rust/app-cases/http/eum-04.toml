[request]
method = "POST"
path = "/v1/embeddings"
body = '{"model":"bedrock/amazon.titan-embed-text-v2:0","input":42}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 400

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
