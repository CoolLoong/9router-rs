[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"alims-intl/qwen3.6-flash","messages":[{"role":"user","content":[{"type":"text","text":"fixture ali chat","cache_control":{"type":"ephemeral"},"signature":"fixture-ignored"}]}],"stream":false}'

[request.headers]
authorization = "Bearer offline-chat-key"
