[request]
method = "POST"
path = "/v1/images/generations"
body = '{"model":"cloudflare-ai/@cf/runwayml/stable-diffusion-v1-5-inpainting","prompt":"offline workers error"}'

[request.headers]
authorization = "Bearer offline-active-key"
content-type = "application/json"

[response]
status = 403

[response.headers]
content-type = "application/json"
retry-after = "120"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
