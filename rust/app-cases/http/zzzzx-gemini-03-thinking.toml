[request]
method = "POST"
path = "/v1/chat/completions"
body = '{"model":"gemini/gemini-4-argon(low)","messages":[{"role":"user","content":"Gemini thinking"}],"stream":false,"max_tokens":128}'

[request.headers]
authorization = "Bearer offline-chat-key"
content-type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-origin = "*"
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch, Accept-Encoding"
