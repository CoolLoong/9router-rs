[package]
name = "router-health-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/app/api/health/`, generated by rust-anything"

[lib]
path = "src/entry.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["node-bindings"]
node-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "3", features = ["async"], optional = true }
napi-derive = { version = "3", optional = true }
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
napi-build = { version = "2", optional = true }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
