[package]
name = "cli-connect-replay"
version = "0.0.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
url = "2"
