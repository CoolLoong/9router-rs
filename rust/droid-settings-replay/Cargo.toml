[package]
name = "droid-settings-replay"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = "0.8"
crossterm = "0.29"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2"
