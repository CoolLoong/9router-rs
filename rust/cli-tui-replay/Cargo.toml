[package]
name = "cli-tui-replay"
version = "0.0.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
getrandom = "0.4"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
