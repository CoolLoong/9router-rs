<div class="page-heading" id="cli-page" data-tool="{{id}}">
  <a href="/dashboard/cli-tools">Back to CLI tools</a>
  <h1>{{title}}</h1>
  <p class="muted">{{desc}}</p>
</div>
<p id="integration-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="cli-config-title">
  <div class="card-heading"><h2 id="cli-config-title">Router settings</h2><button type="button" class="button" id="cli-refresh">Check status</button></div>
  <p class="muted" id="cli-tool-status" hidden></p>
  <form method="post" class="settings-form" id="cli-config-form">
    <label for="cli-base-url">Router base URL</label>
    <input id="cli-base-url" type="url" required autocomplete="off">
    <div {{model-hidden}}>
      <label for="cli-model">Model ID</label>
      <input id="cli-model" list="cli-model-options" placeholder="provider/model" autocomplete="off">
      <datalist id="cli-model-options"></datalist>
    </div>
    {{extra-models}}
    <label for="cli-key">Gateway API key</label>
    <select id="cli-key"><option value="">Use router default</option></select>
    <div class="key-actions" id="cli-host-actions" {{settings-hidden}}>
      <button type="submit" class="button button-primary" disabled>Apply to host</button>
      <button type="button" class="button button-danger" id="cli-restore">Remove router settings</button>
    </div>
  </form>
  <pre class="usage-log" id="cli-preview"></pre>
  <div class="key-actions">
    <button type="button" class="button" id="cli-copy" disabled>Copy configuration</button>
    <a href="/dashboard/models">Manage model aliases</a>
    <a href="/dashboard/endpoint">Manage API keys</a>
  </div>
</section>
{{tool-advanced}}
