<div class="page-heading">
  <h1>PXPIPE</h1>
  <div class="key-actions"><a href="/dashboard/token-saver">Token Saver settings</a><button class="button" id="pxpipe-refresh" type="button">Refresh</button></div>
</div>
<p id="pxpipe-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="pxpipe-overview-title">
  <div class="card-heading"><h2 id="pxpipe-overview-title">Compression overview</h2>
    <div class="key-actions"><label for="pxpipe-window">Period</label><select id="pxpipe-window">
      <option value="today">Today</option><option value="yesterday">Yesterday</option>
      <option value="last7d" selected>7 days</option><option value="last30d">30 days</option><option value="all">All time</option>
    </select></div>
  </div>
  <div class="key-actions" id="pxpipe-controls">
    <button class="button" type="button" data-pxpipe-action="install">Install PXPIPE</button>
    <button class="button" type="button" data-pxpipe-action="start">Start</button>
    <button class="button" type="button" data-pxpipe-action="stop">Stop</button>
    <button class="button" type="button" data-pxpipe-action="restart">Restart</button>
    <button class="button" type="button" data-pxpipe-action="health">Check health</button>
  </div>
  <dl id="pxpipe-metrics" class="usage-metrics"></dl>
</section>
<section class="card" aria-labelledby="pxpipe-trend-title">
  <h2 id="pxpipe-trend-title">Estimated token savings · last 30 days</h2>
  <div class="table-scroll"><table class="usage-table">
    <thead><tr><th scope="col">Date</th><th scope="col">Estimated tokens saved</th></tr></thead><tbody id="pxpipe-trend"></tbody>
  </table></div>
</section>
<section class="card" aria-labelledby="pxpipe-history-title">
  <h2 id="pxpipe-history-title">Recent requests</h2>
  <div class="table-scroll"><table class="usage-table">
    <thead><tr><th scope="col">Time</th><th scope="col">Model</th><th scope="col">Original</th><th scope="col">Compressed</th><th scope="col">Saved</th><th scope="col">Duration</th><th scope="col">Status</th></tr></thead>
    <tbody id="pxpipe-history"></tbody>
  </table></div>
</section>
<section class="card" aria-labelledby="pxpipe-logs-title">
  <h2 id="pxpipe-logs-title">Runtime log</h2>
  <pre id="pxpipe-log" class="console-lines" tabindex="0"></pre>
</section>
