<div class="page-heading" id="media-page" data-combo="{{id}}" data-providers="{{providers}}">
  <a id="media-combo-back" href="/dashboard/media-providers/web">Back to media providers</a>
  <h1 id="media-combo-title">Media combo</h1>
</div>
<p id="integration-status" class="notice" role="status" hidden></p>
<section class="card" aria-label="Media combo settings">
  <form method="post" class="settings-form" id="media-combo-form">
    <fieldset disabled>
      <label for="media-combo-name">Name</label><input id="media-combo-name" pattern="[a-zA-Z0-9_.\-]+" required>
      <label class="check-row"><input id="media-combo-rotate" type="checkbox" disabled>Round Robin</label>
      <label for="media-combo-member">Provider or model ID</label>
      <div class="key-actions">
        <input id="media-combo-member" list="media-combo-options" autocomplete="off">
        <datalist id="media-combo-options"></datalist>
        <button class="button" type="button" id="media-combo-add">Add member</button>
      </div>
      <div id="media-combo-order" class="key-list" aria-live="polite"></div>
      <details>
        <summary>Edit model IDs directly</summary>
        <label for="media-combo-members">Ordered model IDs, one per line</label>
        <textarea id="media-combo-members" rows="6"></textarea>
      </details>
      <div class="key-actions">
        <button class="button button-primary" type="submit">Save combo</button>
        <button class="button button-danger" type="button" id="media-combo-delete">Delete combo</button>
      </div>
    </fieldset>
  </form>
</section>
<section class="card" id="media-combo-preview" aria-labelledby="media-combo-preview-title" hidden>
  <div class="card-heading">
    <h2 id="media-combo-preview-title">Test Example</h2>
    <button class="button button-primary" id="media-combo-run" type="button" disabled>Run</button>
    <button class="button" id="media-combo-copy" type="button">Copy cURL</button>
  </div>
  <code id="media-combo-endpoint"></code>
  <pre class="usage-log" id="media-combo-example"></pre>
  <p id="media-combo-result-status" class="notice" role="status" hidden></p>
  <pre class="usage-log" id="media-combo-result" hidden></pre>
  <img id="media-combo-image" alt="Generated image" hidden>
  <audio id="media-combo-audio" controls preload="none" hidden></audio>
  <a id="media-combo-download" class="button" target="_blank" rel="noopener noreferrer" hidden></a>
</section>
<section class="card" aria-labelledby="media-combo-usage-title">
  <h2 id="media-combo-usage-title">Usage Logs</h2>
  <button class="button" id="media-combo-logs-refresh" type="button" disabled>Refresh logs</button>
  <pre class="usage-log" id="media-combo-logs">Loading usage logs…</pre>
</section>
