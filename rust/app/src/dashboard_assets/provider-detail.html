<div class="page-heading" id="provider-detail" data-provider="{{id}}" data-alias="{{alias}}" data-model-kind="{{kind}}">
  <a href="/dashboard/providers">Back to providers</a>
  <h1>{{title}}</h1>
  <p class="muted">{{auth}} · <code>{{alias}}</code></p>
  <div class="key-actions">
    <a href="{{create}}" class="button button-primary" {{create-hidden}}>Add API-key connection</a>
    {{advanced}}
  </div>
</div>
<p id="provider-detail-status" class="notice" role="status" hidden></p>
{{account-setup}}
<section class="card" aria-labelledby="provider-detail-connections-title">
  <div class="card-heading">
    <h2 id="provider-detail-connections-title">Connections</h2>
    <div class="key-actions">
      <button id="provider-detail-reload" class="button" type="button">Refresh</button>
      <button id="provider-detail-test-all" class="button" type="button" disabled>Test active connections</button>
    </div>
  </div>
  <div id="provider-detail-connections" class="key-list" aria-live="polite" aria-busy="true"></div>
  <div id="provider-detail-tests" class="key-list" aria-live="polite"></div>
</section>
<section class="card" aria-labelledby="provider-detail-routing-title">
  <h2 id="provider-detail-routing-title">Connection routing</h2>
  <form id="provider-detail-routing" class="settings-form">
    <fieldset id="provider-detail-routing-fields" disabled>
      <label class="check-row"><input id="provider-detail-round-robin" type="checkbox"> Override with round robin</label>
      <label for="provider-detail-sticky-requests">Requests to keep on one connection</label>
      <input id="provider-detail-sticky-requests" type="number" min="1" step="1" value="1" required>
      <button class="button button-primary" type="submit">Save routing</button>
    </fieldset>
  </form>
</section>
<section class="card" aria-labelledby="provider-detail-models-title">
  <div class="card-heading">
    <h2 id="provider-detail-models-title">Models</h2>
    <div class="key-actions">
      <a href="{{new-model}}" class="button button-primary">Add custom model</a>
      <a href="{{models}}" class="button">Manage aliases and custom models</a>
    </div>
  </div>
  <form id="provider-detail-discovery" class="key-actions">
    <label for="provider-detail-source">Connection for model discovery</label>
    <select id="provider-detail-source" disabled></select>
    <button class="button" type="submit" disabled>Discover models</button>
  </form>
  <label for="provider-detail-model-filter">Find a model</label>
  <input id="provider-detail-model-filter" type="search" autocomplete="off">
  <div class="table-scroll">
    <table class="usage-table">
      <thead><tr><th scope="col">Model</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
      <tbody id="provider-detail-models" aria-live="polite" aria-busy="true"></tbody>
    </table>
  </div>
</section>
<section class="card" aria-labelledby="provider-detail-availability-title">
  <h2 id="provider-detail-availability-title">Model availability</h2>
  <div id="provider-detail-availability" class="key-list" aria-live="polite" aria-busy="true"></div>
</section>
<noscript><p class="muted">Enable JavaScript to manage this provider.</p></noscript>
