<section class="card" aria-labelledby="cli-codex-profiles-title">
  <h2 id="cli-codex-profiles-title">Codex profiles</h2>
  <form class="settings-form" id="cli-codex-profile-form" method="post">
    <label for="cli-codex-profile-name">Profile name</label>
    <input id="cli-codex-profile-name" type="text" pattern="[A-Za-z0-9_\-]+" required>
    <label for="cli-codex-profile-model">Model ID</label>
    <input id="cli-codex-profile-model" list="cli-model-options" required placeholder="provider/model">
    <button class="button button-primary" type="submit">Save profile</button>
  </form>
  <div id="cli-codex-profile-list"></div>
</section>
