<div class="page-heading" id="cli-guide" data-tool="{{id}}" data-external="{{external}}">
  <a href="/dashboard/cli-tools">Back to CLI tools</a>
  <h1>{{title}}</h1>
  <p class="muted">{{desc}}</p>
</div>
<p id="integration-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="cli-guide-title">
  <div class="card-heading">
    <h2 id="cli-guide-title">Set up {{title}}</h2>
    <button type="button" class="button" id="cli-guide-refresh" {{status-hidden}}>Check installation</button>
  </div>
  <p id="cli-guide-status" role="status" hidden></p>
  {{notes}}
  <div class="settings-form" id="cli-guide-values" {{values-hidden}}>
    <label for="cli-guide-base">Router base URL</label>
    <input id="cli-guide-base" type="url" autocomplete="off">
    <label for="cli-guide-key">Gateway API key</label>
    <select id="cli-guide-key"><option value="">Use router default</option></select>
    <label for="cli-guide-model">Model ID</label>
    <input id="cli-guide-model" list="cli-guide-models" placeholder="provider/model-id" autocomplete="off">
    <datalist id="cli-guide-models"></datalist>
  </div>
  {{steps}}
  {{code}}
</section>
