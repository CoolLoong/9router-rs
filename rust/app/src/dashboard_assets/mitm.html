<div class="page-heading"><h1>MITM settings</h1></div>
<p id="mitm-notice" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="mitm-service-title">
  <div class="card-heading">
    <h2 id="mitm-service-title">Local service</h2>
    <button class="button" id="mitm-refresh" type="button">Refresh status</button>
  </div>
  <div class="key-list">
    <p id="mitm-service" class="key-state" aria-live="polite"></p>
    <p id="mitm-certificate" class="key-state" aria-live="polite"></p>
  </div>
  <form id="mitm-router-form">
    <label for="mitm-router-url">Router base URL</label>
    <input type="url" id="mitm-router-url" placeholder="http://localhost:20128" spellcheck="false" disabled>
    <button class="button" id="mitm-router-save" type="submit" disabled>Save URL</button>
  </form>
</section>
<section class="card" aria-labelledby="mitm-alias-title">
  <h2 id="mitm-alias-title">Model mappings</h2>
  <label for="mitm-tool">Client</label>
  <select id="mitm-tool" disabled>{{tools}}</select>
  <p id="mitm-dns" class="key-state" aria-live="polite"></p>
  <form id="mitm-mappings-form">
    <div id="mitm-mappings" class="key-list"></div>
    <button class="button" id="mitm-mappings-save" type="submit" disabled>Save mappings</button>
  </form>
</section>
