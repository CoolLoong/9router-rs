<div class="page-heading">
  <h1>Providers</h1>
  <p class="muted">Manage credentials, priorities and proxy pools for each connection.</p>
</div>
<p id="management-status" class="notice" role="status" hidden></p>
<datalist id="provider-directory">{{directory}}</datalist>
<section class="card" aria-labelledby="provider-connections-title">
  <div class="card-heading">
    <h2 id="provider-connections-title">Connections</h2>
    <a class="button button-primary" href="/dashboard/providers/new">Add API-key connection</a>
  </div>
  <label for="provider-search">Find a connection</label>
  <input id="provider-search" type="search" autocomplete="off">
  <div id="provider-list" class="key-list" aria-live="polite"></div>
</section>
<section class="card" aria-labelledby="provider-batch-title">
  <h2 id="provider-batch-title">Connection tests</h2>
  <form id="provider-batch-form" class="settings-form" method="post">
    <label for="provider-batch-group">Connection group</label>
    <select id="provider-batch-group">
      <option value="apikey">API key</option>
      <option value="oauth">OAuth</option>
      <option value="free">Free tier</option>
    </select>
    <div class="key-actions">
      <button class="button" id="provider-batch-run" type="submit">Test active connections</button>
    </div>
  </form>
  <p id="provider-batch-status" class="notice" role="status" hidden></p>
</section>
<section class="card" id="provider-nodes" aria-labelledby="provider-nodes-title">
  <div class="card-heading">
    <h2 id="provider-nodes-title">Compatible endpoints</h2>
    <a class="button button-primary" href="/dashboard/providers/nodes/new">Add compatible endpoint</a>
  </div>
  <div id="provider-node-list" class="key-list" aria-live="polite" aria-busy="true"></div>
</section>
<section class="card" aria-labelledby="oauth-providers-title">
  <h2 id="oauth-providers-title">OAuth and other sign-in methods</h2>
  <ul class="provider-links">{{oauth-links}}</ul>
</section>
<dialog id="provider-batch-dialog" aria-labelledby="provider-batch-results-title">
  <div class="card-heading">
    <h2 id="provider-batch-results-title">Connection test results</h2>
    <button class="button" id="provider-batch-close" type="button">Close</button>
  </div>
  <p id="provider-batch-summary" role="status"></p>
  <div id="provider-batch-results" class="key-list" role="list"></div>
</dialog>
<noscript><p class="muted">Enable JavaScript to manage connections.</p></noscript>
