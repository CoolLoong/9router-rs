[package]
name = "cli-video-replay"
version = "0.0.0"
edition = "2024"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2"
