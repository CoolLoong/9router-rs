[package]
name = "ninerouter"
version = "0.5.119"
edition = "2024"
publish = false
license = "MIT"
description = "Native Rust 9Router gateway, management console and CLI"

[[bin]]
name = "ninerouter"
path = "src/main.rs"

[features]
default = ["native-package"]
native-package = ["dep:semver"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "server-auto", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
flate2 = "1"
mime_guess = "2"
tar = { version = "0.4", default-features = false }
chat-account-rules-rs = { path = "crates/chat-account-rules-rs" }
anthropic-token-count-rs = { path = "crates/anthropic-token-count-rs" }
model-markers-rs = { path = "crates/model-markers-rs" }
serde_json = "1"
jsonschema = { version = "0.61.2", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.21"
saml-rs = { version = "0.8", default-features = false, features = ["crypto-rustcrypto"] }
sha2 = "0.10"
sha1 = "0.10"
keccak = "0.2"
x509-cert = { version = "0.2", features = ["builder"] }
md-5 = "0.10"
aes = "0.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
cbc = "0.1"
rsa = { version = "0.9", features = ["pem", "sha2"] }
rand = "0.8"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem"] }
hmac = "0.12"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
percent-encoding = "2"
regex = "1"
getrandom = "0.4"
ring = "0.17.14"
semver = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jiff = "0.2.42"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tempfile = "3"
url = "2"
sqlite-schema-rs = { path = "crates/sqlite-schema-rs" }
key-access-rs = { path = "crates/key-access-rs" }
provider-response-rs = { path = "crates/provider-response-rs" }
provider-capabilities-rs = { path = "crates/provider-capabilities-rs" }
gateway-model-resolver-rs = { path = "crates/gateway-model-resolver-rs" }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "stream", "json", "multipart", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
router-health-rs = { path = "crates/router-health-rs" }
gemini-model-list-rs = { path = "crates/gemini-model-list-rs" }
bcrypt = "0.19.3"
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
crossterm = "0.29"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"

[workspace]
resolver = "3"
members = ["crates/*", "tools/benchmark", "tools/package"]
default-members = ["."]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
png = "0.18"
rustix = { version = "1", features = ["event", "fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Memory",
    "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_System_JobObjects",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Console", "Win32_System_LibraryLoader",
    "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
winapi = { version = "0.3", features = ["combaseapi", "knownfolders", "objbase", "objidl", "shlobj", "shobjidl_core"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
libc = "0.2"
plist = "1.10"
rustix = { version = "1", features = ["fs", "process"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage",
    "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar",
    "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSGeometry", "NSObject", "NSString", "NSURL"] }
