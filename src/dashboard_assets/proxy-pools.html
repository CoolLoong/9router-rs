<div class="page-heading">
  <h1>Proxy Pools</h1>
  <p class="muted">Configure and monitor the proxies assigned to provider connections.</p>
</div>
<p id="optimization-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="pool-title">
  <div class="card-heading">
    <h2 id="pool-title">Pools</h2>
    <div class="key-actions">
      <button type="button" class="button button-primary" id="pool-new">New pool</button>
      <button type="button" class="button" id="pool-import">Batch import</button>
      <button type="button" class="button" id="pool-cloudflare-deploy">Deploy Cloudflare relay</button>
      <button type="button" class="button" id="pool-deno-deploy">Deploy Deno relay</button>
      <button type="button" class="button" id="pool-netlify-deploy">Deploy Netlify relay</button>
      <button type="button" class="button" id="pool-vercel-deploy">Deploy Vercel relay</button>
    </div>
  </div>
  <div class="catalog-fields">
    <div><label for="pool-search">Find a pool</label><input type="search" id="pool-search"></div>
    <div><label for="pool-filter">Active state</label><select id="pool-filter"><option value="all">All</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select></div>
  </div>
  <div class="key-actions">
    <label class="check-row"><input type="checkbox" id="pool-select">Select visible pools</label>
    <button type="button" class="button" id="pool-enable">Enable</button>
    <button type="button" class="button" id="pool-disable">Disable</button>
    <button type="button" class="button" id="pool-health">Test health</button>
    <button type="button" class="button" id="pool-clear-selection" hidden>Clear selection</button>
    <button type="button" class="button button-danger" id="pool-delete-selected">Delete selected</button>
  </div>
  <div id="pool-list" class="key-list" aria-live="polite"></div>
</section>
<dialog id="pool-dialog" aria-labelledby="pool-edit-title">
  <form id="pool-form" method="dialog">
    <h2 id="pool-edit-title">Proxy pool</h2>
    <label for="pool-name">Name</label>
    <input id="pool-name" required autocomplete="off">
    <label for="pool-type">Transport</label>
    <select id="pool-type">
      <option value="http">HTTP proxy</option>
      <option value="vercel">Vercel relay</option>
      <option value="cloudflare">Cloudflare relay</option>
      <option value="deno">Deno relay</option>
      <option value="netlify">Netlify relay</option>
    </select>
    <label for="pool-url">Proxy URL</label>
    <input id="pool-url" type="password" autocomplete="new-password" placeholder="https://proxy.example:8080">
    <label for="pool-no-proxy">No-proxy hosts</label>
    <input id="pool-no-proxy" placeholder="localhost,127.0.0.1" autocomplete="off">
    <label class="check-row"><input type="checkbox" id="pool-active" checked>Active</label>
    <label class="check-row"><input type="checkbox" id="pool-strict">Fail the request if this proxy fails</label>
    <p id="pool-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Save pool</button>
    </div>
  </form>
</dialog>
<dialog id="pool-import-dialog" aria-labelledby="pool-import-title">
  <form id="pool-import-form" method="dialog">
    <h2 id="pool-import-title">Import HTTP proxies</h2>
    <label for="pool-import-text">One URL or host:port:user:password per line</label>
    <textarea id="pool-import-text" rows="8" required spellcheck="false"></textarea>
    <p id="pool-import-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-import-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Import</button>
    </div>
  </form>
</dialog>
<dialog id="pool-cloudflare-dialog" aria-labelledby="pool-cloudflare-title">
  <form id="pool-cloudflare-form" method="dialog" autocomplete="off">
    <h2 id="pool-cloudflare-title">Deploy Cloudflare relay</h2>
    <label for="pool-cloudflare-account">Cloudflare account ID</label>
    <input id="pool-cloudflare-account" required autocomplete="off" spellcheck="false">
    <label for="pool-cloudflare-token">Cloudflare API token</label>
    <input id="pool-cloudflare-token" type="password" required autocomplete="new-password" spellcheck="false">
    <label for="pool-cloudflare-name">Worker name (optional)</label>
    <input id="pool-cloudflare-name" autocomplete="off" spellcheck="false">
    <p id="pool-cloudflare-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-cloudflare-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Deploy Worker</button>
    </div>
  </form>
</dialog>
<dialog id="pool-deno-dialog" aria-labelledby="pool-deno-title">
  <form id="pool-deno-form" method="dialog" autocomplete="off">
    <h2 id="pool-deno-title">Deploy Deno relay</h2>
    <label for="pool-deno-account">Organization slug or domain</label>
    <input id="pool-deno-account" required autocomplete="off" spellcheck="false">
    <label for="pool-deno-token">Deno Deploy API token</label>
    <input id="pool-deno-token" type="password" required autocomplete="new-password" spellcheck="false">
    <label for="pool-deno-name">App name (optional)</label>
    <input id="pool-deno-name" autocomplete="off" spellcheck="false">
    <p id="pool-deno-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-deno-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Deploy app</button>
    </div>
  </form>
</dialog>
<dialog id="pool-netlify-dialog" aria-labelledby="pool-netlify-title">
  <form id="pool-netlify-form" method="dialog" autocomplete="off">
    <h2 id="pool-netlify-title">Deploy Netlify relay</h2>
    <label for="pool-netlify-token">Netlify API token</label>
    <input id="pool-netlify-token" type="password" required autocomplete="new-password" spellcheck="false">
    <label for="pool-netlify-name">Site name (optional)</label>
    <input id="pool-netlify-name" autocomplete="off" spellcheck="false">
    <p id="pool-netlify-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-netlify-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Deploy site</button>
    </div>
  </form>
</dialog>
<dialog id="pool-vercel-dialog" aria-labelledby="pool-vercel-title">
  <form id="pool-vercel-form" method="dialog" autocomplete="off">
    <h2 id="pool-vercel-title">Deploy Vercel relay</h2>
    <label for="pool-vercel-token">Vercel API token</label>
    <input id="pool-vercel-token" type="password" required autocomplete="new-password" spellcheck="false">
    <label for="pool-vercel-account">Team ID (optional)</label>
    <input id="pool-vercel-account" placeholder="team_…" autocomplete="off" spellcheck="false">
    <label for="pool-vercel-name">Project name (optional)</label>
    <input id="pool-vercel-name" autocomplete="off" spellcheck="false">
    <p id="pool-vercel-error" class="notice notice-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button" data-optimization-close="pool-vercel-dialog">Cancel</button>
      <button type="submit" class="button button-primary">Deploy project</button>
    </div>
  </form>
</dialog>
<noscript><p class="muted">Enable JavaScript to manage proxy pools.</p></noscript>
