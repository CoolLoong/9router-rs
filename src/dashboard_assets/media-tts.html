<fieldset class="settings-form" id="media-tts" data-catalog="{{catalog}}">
  <legend>Speech model and voice</legend>
  <div {{model-hidden}}>
    <label for="media-tts-model">Model</label>
    <input id="media-tts-model" list="media-tts-models" autocomplete="off">
    <datalist id="media-tts-models"></datalist>
  </div>
  <label for="media-tts-voice">Voice ID</label>
  <input id="media-tts-voice" autocomplete="off">
  <button type="button" class="button" id="media-tts-load" {{browse-hidden}}>Load voices</button>
  <div id="media-tts-voice-list" hidden>
    <label for="media-tts-language">Voice language</label>
    <select id="media-tts-language"><option value="">All languages</option></select>
    <label for="media-tts-voices">Available voices</label>
    <select id="media-tts-voices"><option value="">Choose a voice</option></select>
  </div>
  <label for="media-tts-format">Output format</label>
  <select id="media-tts-format"></select>
  <p class="muted" id="media-tts-status" role="status" hidden></p>
</fieldset>
