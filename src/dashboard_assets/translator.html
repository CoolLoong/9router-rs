<div class="page-heading"><h1>Translator Debug</h1></div>
<p id="translator-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="translator-target-title">
  <h2 id="translator-target-title">Target</h2>
  <div class="catalog-fields">
    <div><label for="translator-provider">Provider</label><input id="translator-provider" autocomplete="off"></div>
    <div><label for="translator-model">Model</label><input id="translator-model" autocomplete="off"></div>
  </div>
  <p id="translator-formats" class="muted" hidden></p>
</section>
<div class="translator-stages">{{panels}}</div>
<noscript><p class="muted">Enable JavaScript to load and translate requests.</p></noscript>
