<label for="cli-grok-context">Model context window</label>
<input id="cli-grok-context" type="number" min="1" placeholder="Model default">
<fieldset data-grok-subagent="general-purpose">
  <legend>General-purpose subagent</legend>
  <label for="cli-grok-general-model">Model ID</label><input id="cli-grok-general-model" list="cli-model-options" data-model>
  <label for="cli-grok-general-context">Context window</label><input id="cli-grok-general-context" type="number" min="1" data-context>
</fieldset>
<fieldset data-grok-subagent="explore">
  <legend>Explore subagent</legend>
  <label for="cli-grok-explore-model">Model ID</label><input id="cli-grok-explore-model" list="cli-model-options" data-model>
  <label for="cli-grok-explore-context">Context window</label><input id="cli-grok-explore-context" type="number" min="1" data-context>
</fieldset>
<fieldset data-grok-subagent="plan">
  <legend>Plan subagent</legend>
  <label for="cli-grok-plan-model">Model ID</label><input id="cli-grok-plan-model" list="cli-model-options" data-model>
  <label for="cli-grok-plan-context">Context window</label><input id="cli-grok-plan-context" type="number" min="1" data-context>
</fieldset>
