<div class="page-heading"><h1>Console log</h1></div>
<section class="card" aria-label="Runtime logs">
  <div class="card-heading">
    <p id="console-status" class="muted" role="status">Connecting…</p>
    <button class="button" id="console-clear" type="button">Clear</button>
  </div>
  <pre id="console-lines" class="console-lines" tabindex="0" aria-label="Runtime log lines"></pre>
</section>
