<section class="card" aria-labelledby="media-credentials-title">
  <h2 id="media-credentials-title">{{title}}</h2>
  <form id="media-credential-form" class="settings-form" method="post" data-scheme="{{scheme}}" autocomplete="off">
    <label for="media-credential-name">Connection name</label>
    <input id="media-credential-name" required>
    <div class="settings-form" {{key-hidden}}>
      <label for="media-credential-key">{{key-label}}</label>
      <input id="media-credential-key" type="password" autocomplete="new-password">
    </div>
    <div class="settings-form" {{url-hidden}}>
      <label for="media-credential-url">{{url-label}}</label>
      <input id="media-credential-url" type="url" placeholder="{{url-placeholder}}">
    </div>
    <div class="settings-form" {{account-hidden}}>
      <label for="media-credential-account">Cloudflare account ID</label>
      <input id="media-credential-account">
    </div>
    <div class="settings-form" {{vertex-hidden}}>
      <label for="media-credential-file">Service account JSON file</label>
      <input id="media-credential-file" type="file" accept="application/json,.json">
      <label for="media-credential-location">Location</label>
      <input id="media-credential-location" placeholder="Default location">
    </div>
    <div class="settings-form" {{polly-hidden}}>
      <label for="media-credential-aws-access">AWS access key ID</label>
      <input id="media-credential-aws-access" autocomplete="off">
      <label for="media-credential-aws-region">AWS region</label>
      <input id="media-credential-aws-region" placeholder="Default region" autocomplete="off">
      <label for="media-credential-aws-token">AWS session token</label>
      <input id="media-credential-aws-token" type="password" autocomplete="new-password">
      <label id="media-credential-aws-clear-row" class="check-row" hidden>
        <input id="media-credential-aws-clear" type="checkbox"> Remove saved session token
      </label>
    </div>
    <div class="key-actions">
      <button type="submit" class="button button-primary">Save connection</button>
      <button type="button" class="button" id="media-credential-cancel" hidden>Cancel edit</button>
      <a id="media-credential-settings" hidden>Connection settings</a>
    </div>
  </form>
</section>
