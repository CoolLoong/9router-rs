<div class="page-heading">
  <h1>Pricing Settings</h1>
  <p>Rates are in US dollars per million tokens.</p>
</div>
<p id="pricing-status" class="notice" role="status" hidden></p>
<section class="card" aria-labelledby="pricing-title">
  <div class="card-heading">
    <h2 id="pricing-title">Model rates</h2>
    <p id="pricing-count" class="muted"></p>
  </div>
  <form id="pricing-form">
    <div class="catalog-fields">
      <div><label for="pricing-provider">Provider</label><select id="pricing-provider"></select></div>
      <div><label for="pricing-filter">Filter models</label><input id="pricing-filter" type="search" autocomplete="off"></div>
    </div>
    <div class="table-scroll">
      <table class="usage-table pricing-table">
        <thead><tr><th scope="col">Model</th><th scope="col">Input</th><th scope="col">Output</th><th scope="col">Cached</th><th scope="col">Reasoning</th><th scope="col">Cache creation</th></tr></thead>
        <tbody id="pricing-rates"></tbody>
      </table>
    </div>
    <div class="key-actions">
      <button class="button button-primary" id="pricing-save" type="submit" disabled>Save changes</button>
      <button class="button button-danger" id="pricing-reset" type="button" disabled>Reset all rates</button>
    </div>
  </form>
</section>
