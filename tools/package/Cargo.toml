[package]
name = "ninerouter-package"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
flate2 = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
