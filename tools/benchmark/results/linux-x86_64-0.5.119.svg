<svg xmlns="http://www.w3.org/2000/svg" width="974" height="716" viewBox="0 0 974 716" role="img" aria-labelledby="title description">
<title id="title">9Router gateway benchmark</title>
<desc id="description">Throughput, Original Node.js, median 372.6 req/s. Throughput, 9Router Rust, median 12,153.6 req/s. p95 latency, Original Node.js, median 27.90 ms. p95 latency, 9Router Rust, median 0.85 ms. p50 latency, Original Node.js, median 21.02 ms. p50 latency, 9Router Rust, median 0.63 ms. p99 latency, Original Node.js, median 34.52 ms. p99 latency, 9Router Rust, median 1.17 ms. Gateway CPU / request, Original Node.js, median 3.11 ms. Gateway CPU / request, 9Router Rust, median 0.47 ms. Sampled peak RSS, Original Node.js, median 246.0 MiB. Sampled peak RSS, 9Router Rust, median 39.3 MiB. Warm RSS, Original Node.js, median 166.7 MiB. Warm RSS, 9Router Rust, median 37.3 MiB. Time to ready, Original Node.js, median 309.9 ms. Time to ready, 9Router Rust, median 12.0 ms.</desc>
